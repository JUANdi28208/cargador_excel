version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: excel_uploader
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=mysql+pymysql://app_user:app_password@mysql:3306/excel_uploader
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=False
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  excel-uploader:
    build:
      context: .
      dockerfile: excel-uploader/Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./excel-uploader:/usr/src/app
    environment:
      - NODE_ENV=development
    depends_on:
      - app

volumes:
  mysql_data: